version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Keep update discovery available without creating maintenance branches.
    # Security alerts and CodeQL remain enabled at repository level.
    open-pull-requests-limit: 0
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
  - package-ecosystem: terraform
    directory: /infra/terraform-google
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
  - package-ecosystem: docker
    directory: /infra/node/backup
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
