name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: orbitcid-ci-only
          POSTGRES_DB: orbitcid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orbitcid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.9
      - run: npm ci
      - run: npm run security:release
      - run: npm run typecheck
      - run: npm test
      - run: npm --workspace frontend run db:migrate && npm --workspace frontend run db:verify-isolation
        env:
          DATABASE_URL: postgresql://postgres:orbitcid-ci-only@127.0.0.1:5432/orbitcid
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: terraform fmt -check -recursive infra/terraform
      - run: terraform fmt -check -recursive infra/terraform-google
      - run: terraform -chdir=infra/terraform init -backend=false -input=false && terraform -chdir=infra/terraform validate
      - run: terraform -chdir=infra/terraform-google init -backend=false -input=false && terraform -chdir=infra/terraform-google validate
      - run: docker compose --env-file .env.example config --quiet
        working-directory: infra/node
        env:
          BRIDGE_TOKEN: ci-only-bridge-token-at-least-32-characters
          RCLONE_REMOTE: ci:orbitcid
          ORBITCID_FRONTEND_ORIGIN: https://app.example.com
          ORBITCID_BACKEND_PUBLIC_URL: https://node.example.com
      - run: docker compose --env-file .env.example --profile backup --profile tunnel config --quiet
        working-directory: infra/node
        env:
          BRIDGE_TOKEN: ci-only-bridge-token-at-least-32-characters
          RCLONE_REMOTE: ci:orbitcid
          ORBITCID_FRONTEND_ORIGIN: https://app.example.com
          ORBITCID_BACKEND_PUBLIC_URL: https://node.example.com
          TUNNEL_TOKEN: ci-only-tunnel-placeholder
      - run: node --check backend/pair.mjs && node --check backend/grant-auth.mjs && node --check infra/kubo/bridge.mjs
      - run: bash -n infra/kubo/startup.sh.tftpl infra/node/backup/backup.sh infra/node/backup/restore.sh infra/node/kubo-init/001-orbitcid.sh
