name: orbitcid-node

services:
  kubo:
    image: ${KUBO_IMAGE:-ipfs/kubo:v0.43.0@sha256:63f5502f7a01b82a675e45bae81b2f5dfa90248ec4a86cd0a58c218347e1f2d2}
    restart: unless-stopped
    environment:
      IPFS_PROFILE: server
    volumes:
      - ipfs-data:/data/ipfs
      - ./kubo-init:/container-init.d:ro
    ports:
      - "${SWARM_PORT:-4001}:4001/tcp"
      - "${SWARM_PORT:-4001}:4001/udp"
      - "127.0.0.1:${KUBO_API_PORT:-5001}:5001"
      - "127.0.0.1:${KUBO_GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  agent:
    image: orbitcid-agent:local
    build:
      context: ../..
      dockerfile: infra/node/agent/Dockerfile
    restart: unless-stopped
    read_only: true
    environment:
      KUBO_API: http://kubo:5001
      KUBO_GATEWAY: http://kubo:8080
      PORT: "8788"
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-536870912000}
      PAIRING_CONFIG_PATH: /var/lib/orbitcid/pairing.json
      BACKUP_WORK_ROOT: /backups
      TMPDIR: /var/lib/orbitcid
    volumes:
      - agent-staging:/var/lib/orbitcid
      - backup-cache:/backups
    ports:
      - "127.0.0.1:${AGENT_PORT:-8788}:8788"
    command: ["node", "/app/infra/kubo/bridge.mjs"]
    depends_on:
      kubo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  pair:
    image: ${AGENT_IMAGE:-node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32}
    profiles: ["pair"]
    read_only: true
    environment:
      ORBITCID_FRONTEND_ORIGIN: ${ORBITCID_FRONTEND_ORIGIN:?ORBITCID_FRONTEND_ORIGIN is required}
      ORBITCID_BACKEND_PUBLIC_URL: ${ORBITCID_BACKEND_PUBLIC_URL:?ORBITCID_BACKEND_PUBLIC_URL is required}
      PAIRING_CONFIG_PATH: /var/lib/orbitcid/pairing.json
    volumes:
      - ../../backend/pair.mjs:/app/pair.mjs:ro
      - agent-staging:/var/lib/orbitcid
    command: ["node", "/app/pair.mjs"]
    stdin_open: true
    tty: true
    security_opt:
      - no-new-privileges:true

  backup:
    build:
      context: ./backup
    profiles: ["backup"]
    environment:
      KUBO_API: http://kubo:5001
      RCLONE_REMOTE: ${RCLONE_REMOTE:?RCLONE_REMOTE is required}
      RCLONE_CONFIG: /config/rclone/rclone.conf
      RCLONE_CONFIG_PASS: ${RCLONE_CONFIG_PASS:-}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
    volumes:
      - backup-cache:/backups
      - ${RCLONE_CONFIG_PATH:-./rclone.conf}:/config/rclone/rclone.conf:ro
    depends_on:
      kubo:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  ipfs-data:
  agent-staging:
  backup-cache:
